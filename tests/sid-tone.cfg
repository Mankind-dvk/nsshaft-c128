MEMORY {
    ZP:       file = "", start = $0002, size = $001A, type = rw;
    LOADADDR: file = %O, start = $1BFF, size = $0002;
    MAIN:     file = %O, start = $1C01, size = $01FF, fill = yes, fillval = $00;
}

SEGMENTS {
    LOADADDR: load = LOADADDR, type = ro;
    BASIC:    load = MAIN,     type = ro, start = $1C01;
    CODE:     load = MAIN,     type = rw, start = $1D00;
}
